[project]
name = "gs-meetings"
version = "0.3.1"
description = "Collect and parse official Gram Sabha participation reports"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Gaurav Sood", email = "contact@gsood.com"}]
keywords = ["India", "panchayat", "Gram Sabha", "participation"]
classifiers = ["Intended Audience :: Science/Research", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]
dependencies = [
    "requests>=2.32",
    "urllib3>=2.7",
    "pyarrow>=21",
    "beautifulsoup4>=4.13",
    "pillow>=12.3",
    "lxml>=6",
]

[project.urls]
Repository = "https://github.com/in-rolls/gs_meetings"
Issues = "https://github.com/in-rolls/gs_meetings/issues"
Source = "https://gpdp.nic.in/summaryAnalysisReport.html"
Data = "https://doi.org/10.5281/zenodo.22772026"

[project.scripts]
gs-meetings = "gs_meetings.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pre-commit>=4",
    { include-group = "test" },
]
test = ["pytest>=8"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention this standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`,
# which the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Unused fixture arguments and private-member access are how tests are written.
"tests/**" = ["S101", "D", "ARG", "SLF"]

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
log_level = "INFO"
xfail_strict = true
filterwarnings = ["error"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
